apiVersion: v1
kind: Secret
metadata:
  name: astra-secrets
  namespace: astra
  labels:
    app.kubernetes.io/part-of: astra
type: Opaque
# IMPORTANT: Replace these base64-encoded placeholders before deploying.
# Generate with: echo -n 'your-value' | base64
data:
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  S3_ACCESS_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  S3_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  OPENAI_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  STRIPE_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GITHUB_CLIENT_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GITHUB_CLIENT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  MICROSOFT_CLIENT_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  MICROSOFT_CLIENT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  SMTP_USER: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  SMTP_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"
---
# For production, consider using:
# - AWS Secrets Manager with External Secrets Operator
# - HashiCorp Vault with the Vault CSI Provider
# - Sealed Secrets for GitOps
