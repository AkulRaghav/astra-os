apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-rust
  namespace: astra
  labels:
    app: core-rust
    app.kubernetes.io/part-of: astra
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-rust
  template:
    metadata:
      labels:
        app: core-rust
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: core-rust
          image: ghcr.io/astra-os/core-rust:latest
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: astra-config
            - secretRef:
                name: astra-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: core-rust
---
apiVersion: v1
kind: Service
metadata:
  name: core-rust
  namespace: astra
  labels:
    app: core-rust
spec:
  selector:
    app: core-rust
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
