version: '3.8'

services:
  # ===========================================
  # DATA STORES
  # ===========================================
  
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astra-postgres
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: astra-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create default buckets
  minio-init:
    image: minio/mc:latest
    container_name: astra-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set astra http://minio:9000 minioadmin minioadmin;
      mc mb astra/astra-files --ignore-existing;
      mc mb astra/astra-avatars --ignore-existing;
      mc mb astra/astra-attachments --ignore-existing;
      mc anonymous set download astra/astra-avatars;
      exit 0;
      "

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: astra-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===========================================
  # APPLICATION SERVICES
  # ===========================================

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: astra-api-gateway
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://astra:astra@postgres:5432/astra?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "dev-secret-change-in-production"
      CORS_ORIGIN: "http://localhost:3000"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "astra-files"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      AI_SERVICE_URL: "ai-service:50051"
      RUST_SERVICE_URL: "core-rust:50052"
      WS_GATEWAY_URL: "ws-gateway:8081"
      FRONTEND_URL: "http://localhost:3000"
      BASE_URL: "http://localhost:8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ws-gateway:
    build:
      context: ../../services/ws-gateway
      dockerfile: Dockerfile
    container_name: astra-ws-gateway
    environment:
      PORT: "8081"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    container_name: astra-ai-service
    environment:
      AI_PORT: "8082"
      AI_DATABASE_URL: "postgresql://astra:astra@postgres:5432/astra"
      AI_REDIS_URL: "redis://redis:6379/0"
      AI_OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_VECTOR_DB_URL: "postgresql://astra:astra@postgres:5432/astra"
      AI_GRPC_PORT: "50051"
    ports:
      - "8082:8082"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # core-rust:
  #   build:
  #     context: ../../
  #     dockerfile: services/core-rust/Dockerfile
  #   container_name: astra-core-rust
  #   environment:
  #     PORT: "50052"
  #   ports:
  #     - "50052:50052"
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
