syntax = "proto3";

package astra.realtime;

option go_package = "github.com/astra-os/proto/realtime";

service RealtimeService {
  // Publish event to a channel
  rpc Publish(PublishRequest) returns (PublishResponse);
  
  // Subscribe to channel events (server-streaming)
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  
  // Update user presence
  rpc UpdatePresence(PresenceRequest) returns (PresenceResponse);
  
  // Get online users in a workspace
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
  
  // Send notification to user
  rpc SendNotification(NotificationRequest) returns (NotificationResponse);
}

message PublishRequest {
  string channel = 1;
  string event = 2;
  bytes data = 3;
  string sender_id = 4;
}

message PublishResponse {
  bool success = 1;
  int32 recipients = 2;
}

message SubscribeRequest {
  repeated string channels = 1;
  string user_id = 2;
}

message Event {
  string channel = 1;
  string event = 2;
  bytes data = 3;
  string sender_id = 4;
  int64 timestamp = 5;
}

message PresenceRequest {
  string user_id = 1;
  string status = 2;    // "online", "away", "offline"
  string workspace_id = 3;
}

message PresenceResponse {
  bool success = 1;
}

message GetPresenceRequest {
  string workspace_id = 1;
}

message GetPresenceResponse {
  repeated UserPresence users = 1;
}

message UserPresence {
  string user_id = 1;
  string status = 2;
  int64 last_seen = 3;
}

message NotificationRequest {
  string user_id = 1;
  string type = 2;
  string title = 3;
  string message = 4;
  string action_url = 5;
  map<string, string> metadata = 6;
}

message NotificationResponse {
  string notification_id = 1;
  bool delivered = 2;
}
