name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===========================================
  # Frontend
  # ===========================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  # ===========================================
  # API Gateway (Go)
  # ===========================================
  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v -race

  # ===========================================
  # WebSocket Gateway (Go)
  # ===========================================
  ws-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ws-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v -race

  # ===========================================
  # AI Service (Python)
  # ===========================================
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio httpx
      - run: ruff check .
      - run: pytest -v

  # ===========================================
  # Core Rust Service
  # ===========================================
  core-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # ===========================================
  # Shared Packages
  # ===========================================
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install typescript
      - run: npx tsc --noEmit

  # ===========================================
  # Docker Build (CI validation) - Run manually or on release
  # ===========================================
  # docker:
  #   runs-on: ubuntu-latest
  #   needs: [frontend, api-gateway, ws-gateway, ai-service]
  #   if: false  # Disabled - enable when deploying
  #   ...

  # ===========================================
  # Deploy — disabled until production setup
  # ===========================================
  # deploy:
  #   ...

