name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===========================================
  # Frontend
  # ===========================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  # ===========================================
  # API Gateway (Go)
  # ===========================================
  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v -race

  # ===========================================
  # WebSocket Gateway (Go)
  # ===========================================
  ws-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ws-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v -race

  # ===========================================
  # AI Service (Python)
  # ===========================================
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest pytest-asyncio httpx
      - run: ruff check .
      - run: pytest -v

  # ===========================================
  # Core Rust Service
  # ===========================================
  core-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # ===========================================
  # Shared Packages
  # ===========================================
  shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install typescript
      - run: npx tsc --noEmit

  # ===========================================
  # Docker Build (CI validation)
  # ===========================================
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, api-gateway, ws-gateway, ai-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: services/api-gateway
          - service: ws-gateway
            context: services/ws-gateway
          - service: ai-service
            context: services/ai-service
          - service: core-rust
            context: .
            dockerfile: services/core-rust/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: false
          tags: astra/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Deploy — Build & Push to Registry (main only)
  # ===========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: services/api-gateway
          - service: ws-gateway
            context: services/ws-gateway
          - service: ai-service
            context: services/ai-service
          - service: core-rust
            context: .
            dockerfile: services/core-rust/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notification
        run: |
          echo "Deployed ${{ matrix.service }}:${{ github.sha }} to registry"
